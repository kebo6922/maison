<title>Agenda Familial – Partagé</title>
<script>
(function(){
  const MOT_DE_PASSE = 'Maison05';
  const CLE = 'maison_auth';
  if (localStorage.getItem(CLE) !== MOT_DE_PASSE) {
    document.addEventListener('DOMContentLoaded', function() {
      document.body.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#f0f4f8;font-family:sans-serif;">
          <div style="background:white;padding:40px;border-radius:16px;box-shadow:0 4px 24px rgba(0,0,0,0.12);text-align:center;max-width:320px;width:90%;">
            <div style="font-size:2.5rem;margin-bottom:12px;">🏠</div>
            <h2 style="margin:0 0 8px;color:#2d3748;">Agenda Familial</h2>
            <p style="color:#718096;font-size:0.9rem;margin-bottom:24px;">Entrez le mot de passe pour accéder</p>
            <input id="mdp" type="password" placeholder="Mot de passe" autofocus
              style="width:100%;padding:12px;border:2px solid #e2e8f0;border-radius:8px;font-size:1rem;box-sizing:border-box;outline:none;margin-bottom:12px;"
              onkeydown="if(event.key==='Enter')verif()">
            <div id="err" style="color:#e53e3e;font-size:0.85rem;min-height:20px;margin-bottom:8px;"></div>
            <button onclick="verif()" style="width:100%;padding:12px;background:#667eea;color:white;border:none;border-radius:8px;font-size:1rem;font-weight:600;cursor:pointer;">Entrer</button>
          </div>
        </div>`;
      window.verif = function() {
        const val = document.getElementById('mdp').value;
        if (val === MOT_DE_PASSE) {
          localStorage.setItem(CLE, MOT_DE_PASSE);
          location.reload();
        } else {
          document.getElementById('err').textContent = 'Mot de passe incorrect';
          document.getElementById('mdp').value = '';
          document.getElementById('mdp').focus();
        }
      };
    });
    document.addEventListener('DOMContentLoaded', function(e) { e.stopImmediatePropagation(); }, true);
  }
})();
</script>

<!-- Firebase SDK (même base que le planning maison) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, set, onValue, update, remove }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey:            "AIzaSyB2YnkiivjhxOmmAfS9JtvRRWwB3dsF86U",
    authDomain:        "planning-maison-7eace.firebaseapp.com",
    databaseURL:       "https://planning-maison-7eace-default-rtdb.europe-west1.firebasedatabase.app",
    projectId:         "planning-maison-7eace",
    storageBucket:     "planning-maison-7eace.firebasestorage.app",
    messagingSenderId: "365827317336",
    appId:             "1:365827317336:web:27412c4c05d67a7a81342d"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  // Même nœud que le planning maison → données partagées
  const tasksRef = ref(db, "planning/tasks");

  onValue(tasksRef, (snapshot) => {
    window._tasks = {};
    if (snapshot.exists()) {
      snapshot.forEach(child => {
        window._tasks[child.key] = { id: child.key, ...child.val() };
      });
    }
    renderAll();
  });

  window.fbAdd = async (task) => {
    const newRef = push(tasksRef);
    await set(newRef, { ...task, id: newRef.key });
    return newRef.key;
  };
  window.fbUpdate = async (id, data) => {
    await update(ref(db, `planning/tasks/${id}`), data);
  };
  window.fbDelete = async (id) => {
    await remove(ref(db, `planning/tasks/${id}`));
  };
</script>

<script>
// ═══════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════
const MEMBERS = ['Machin', 'Bidule', 'Bibi'];
const PERSON_COLORS = {
  'Machin': { bg: '#bee3f8', text: '#1a365d', border: '#90cdf4' },
  'Bidule': { bg: '#fc8181', text: '#742a2a', border: '#e53e3e' },
  'Bibi':   { bg: '#c6f6d5', text: '#1a4731', border: '#68d391' },
};

// Retourne le style de fond pour un auteur (1 ou plusieurs personnes)
function getPersonStyle(author) {
  if (!author) return { bg: '#edf2f7', text: '#2d3748', border: '#e2e8f0', gradient: false };
  const names = author.split(',').map(n => n.trim()).filter(Boolean);
  if (names.length === 1) {
    const c = PERSON_COLORS[names[0]];
    return c ? { bg: c.bg, text: c.text, border: c.border, gradient: false }
             : { bg: '#edf2f7', text: '#2d3748', border: '#e2e8f0', gradient: false };
  }
  const colors  = names.map(n => (PERSON_COLORS[n] || { bg: '#edf2f7' }).bg);
  const borders = names.map(n => (PERSON_COLORS[n] || { border: '#e2e8f0' }).border);
  let bgStyle;
  if (colors.length === 2) {
    bgStyle = `linear-gradient(135deg, ${colors[0]} 0%, ${colors[0]} 45%, ${colors[1]} 55%, ${colors[1]} 100%)`;
  } else {
    const pct = 100 / colors.length;
    const stops = colors.map((c, i) => `${c} ${Math.round(i*pct)}%, ${c} ${Math.round((i+1)*pct)}%`).join(', ');
    bgStyle = `linear-gradient(135deg, ${stops})`;
  }
  return { bg: bgStyle, text: '#2d3748', border: borders[0], gradient: true };
}

const TYPE_CLASS = {
  sport:     'type-sport',
  diner:     'type-diner',
  sortie:    'type-sortie',
  bricolage: 'type-bricolage',
  jardin:    'type-jardin',
  entretien: 'type-entretien',
  admin:     'type-admin',
  rdv:    'type-rdv',
  autre:  'type-autre',
};
const TYPE_EMOJI = {
  sport:'🏃', diner:'🍽️', sortie:'🎉', rdv:'📅',
  bricolage:'🔨', jardin:'🌿', entretien:'🔧', admin:'📋', autre:'📌'
};

// ── Profil utilisateur — priorité : URL ?user=Bidule → localStorage ──
(function() {
  const urlUser = new URLSearchParams(window.location.search).get('user');
  if (urlUser && ['Machin','Bidule','Bibi'].includes(urlUser)) {
    localStorage.setItem('pmUser', urlUser);
    const url = new URL(window.location);
    url.searchParams.delete('user');
    history.replaceState({}, '', url);
  }
})();
let currentUser = localStorage.getItem('pmUser') || '';

// ── État ──────────────────────────────────────────────
let viewYear, viewMonth;
let editId = null;
let darkMode = localStorage.getItem('pmDark') === '1';

// Synchroniser dark mode avec le planning maison (même clé localStorage)
if (darkMode) document.body.classList.add('dark');
document.getElementById('darkBtn').textContent = darkMode ? '☀️' : '🌙';

// Afficher le profil dans le badge header (lecture seule)
function updateUserBadge() {
  const badge = document.getElementById('agUserBadge');
  if (badge) badge.textContent = currentUser ? '👤 ' + currentUser : '👤 ?';
}
updateUserBadge();

function toggleDark() {
  darkMode = !darkMode;
  document.body.classList.toggle('dark', darkMode);
  localStorage.setItem('pmDark', darkMode ? '1' : '0');
  document.getElementById('darkBtn').textContent = darkMode ? '☀️' : '🌙';
}

// ── Init date ─────────────────────────────────────────
const now = new Date();
viewYear  = now.getFullYear();
viewMonth = now.getMonth();

// ── Tâches exposées par Firebase ─────────────────────
window._tasks = {};

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function toDateStr(d) {
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// Retourne tous les events (agenda natifs + tâches rdv du planning)
function getEvents() {
  const evts = {};
  Object.values(window._tasks).forEach(t => {
    if (!t.date) return;
    // Events natifs de l'agenda (cat = 'agenda') — priorité absolue, pas de doublon
    if (t.cat === 'agenda') {
      evts[t.id] = t;
      return;
    }
    // Tâches RDV du planning uniquement (pas les events agenda déjà traités)
    if (t.status === 'rdv' || t.cat === 'rdv') {
      evts[t.id] = { ...t, evType: 'rdv', isFromPlanning: true };
    }
  });
  return evts;
}

function eventMatchesDay(e, dateStr) {
  if (!e.recurrence || !e.date || e.date >= dateStr) return false;
  // Respect de la date de fin de récurrence
  if (e.recurrenceFin && dateStr > e.recurrenceFin) return false;

  const base   = new Date(e.date + 'T00:00:00');
  const target = new Date(dateStr + 'T00:00:00');
  const diffDays = Math.round((target - base) / 86400000);

  if (e.recurrence === 'hebdo') {
    return base.getDay() === target.getDay() && diffDays % 7 === 0;
  }
  if (e.recurrence === 'hebdo2') {
    return base.getDay() === target.getDay() && diffDays % 14 === 0;
  }
  if (e.recurrence === 'hebdo3') {
    return base.getDay() === target.getDay() && diffDays % 21 === 0;
  }
  if (e.recurrence === 'mensuel') {
    // Même date du mois
    return target.getDate() === base.getDate() &&
           (target.getFullYear() > base.getFullYear() || target.getMonth() > base.getMonth());
  }
  if (e.recurrence === 'mensuel_jour') {
    // Même numéro de semaine dans le mois + même jour de la semaine
    // ex: "2e lundi" — semaine du mois = Math.ceil(date/7)
    const weekInMonth = d => Math.ceil(d.getDate() / 7);
    return target.getDay() === base.getDay() &&
           weekInMonth(target) === weekInMonth(base) &&
           (target.getFullYear() > base.getFullYear() || target.getMonth() > base.getMonth());
  }
  if (e.recurrence === 'annuel') {
    return target.getDate() === base.getDate() &&
           target.getMonth() === base.getMonth() &&
           target.getFullYear() > base.getFullYear();
  }
  if (e.recurrence === 'perso') {
    const n = parseInt(e.recurrenceN) || 1;
    return diffDays > 0 && diffDays % n === 0;
  }
  return false;
}

function eventsForDay(dateStr) {
  const allEvts = Object.values(getEvents());
  // Events ponctuels sur cette date exacte
  const ponctuel = allEvts.filter(e => {
    if (e.date !== dateStr) return false;
    if (e.dateFin && e.dateFin > e.date) return false; // géré par les bandeaux multi-jours
    return true;
  });
  // Occurrences récurrentes de cette date
  const recurrents = allEvts
    .filter(e => e.recurrence && eventMatchesDay(e, dateStr))
    .map(e => ({ ...e, id: e.id + '_' + dateStr, _originalId: e.id, date: dateStr }));
  return [...ponctuel, ...recurrents].sort((a,b) => {
      const hasA = !!a.time;
      const hasB = !!b.time;
      // Events avec heure en premier, triés par heure
      if (hasA && hasB) return a.time < b.time ? -1 : a.time > b.time ? 1 : 0;
      if (hasA && !hasB) return -1;  // a a une heure → avant
      if (!hasA && hasB) return 1;   // b a une heure → b avant
      return 0; // tous les deux sans heure
    });
}

function getMultiDayEvents(dateStr) {
  return Object.values(getEvents()).filter(e => {
    if (!e.dateFin || e.dateFin <= e.date) return false;
    return dateStr >= e.date && dateStr <= e.dateFin;
  });
}

function buildMultiDayBanners(ds) {
  const multiEvts = getMultiDayEvents(ds);
  if (!multiEvts.length) return '';
  return multiEvts.map(e => {
    const typeColors = { sport:'#38a169', diner:'#e07b39', sortie:'#9b59d0', rdv:'#3182ce', bricolage:'#c05621', jardin:'#276749', entretien:'#2b6cb0', admin:'#6b46c1', autre:'#718096' };
    const typeColor = typeColors[getEventType(e)] || '#718096';
    // Fond = couleur de la/les personne(s), bordure gauche = couleur du type
    const personS  = getPersonStyle(e.author);
    const bgColor  = personS.gradient ? personS.bg : personS.bg;
    const bgProp   = personS.gradient ? 'background' : 'background';
    const txtColor = personS.text;
    const isStart = ds === e.date;
    const isEnd   = ds === e.dateFin;
    const who = (e.author||'').split(',').map(n=>n.trim()).filter(Boolean).join(', ');
    let label = e.title || '';
    if (isStart && !isEnd) label = `${label} ▶`;
    else if (isEnd && !isStart) label = `◀ ${label}`;
    const br = isStart && isEnd ? '5px' : isStart ? '5px 0 0 5px' : isEnd ? '0 5px 5px 0' : '0';
    return `<div onclick="event.stopPropagation();openEdit('${e.id}')"
      style="background:${bgColor};border-left:3px solid ${typeColor};border-right:${isEnd?'2px solid '+typeColor:'none'};border-top:1px solid ${typeColor}55;border-bottom:1px solid ${typeColor}55;
      padding:1px 5px;margin-bottom:2px;font-size:0.65rem;font-weight:700;color:${txtColor};
      border-radius:${br};cursor:pointer;display:flex;justify-content:space-between;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
      <span style="overflow:hidden;text-overflow:ellipsis;">${label}</span>
      ${isStart && who ? `<span style="flex-shrink:0;opacity:0.8;margin-left:4px;">${who}</span>` : ''}
    </div>`;
  }).join('');
}

function getEventType(e) {
  return e.evType || e.type || (e.isFromPlanning ? 'rdv' : 'autre');
}

function eventLabel(e) {
  const emoji = TYPE_EMOJI[getEventType(e)] || '📌';
  let timeStr = '';
  if (e.time) {
    timeStr = ` ${e.time}`;
    if (e.timeEnd) timeStr += `→${e.timeEnd}`;
  }
  return `${emoji}${timeStr} ${e.title || e.label || ''}`;
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
function renderAll() {
  renderWeekStrip();
  renderCalendar();
  renderMobileList();
  showRappelBanner();
}

// ── Vue liste mobile ──────────────────────────────────
function renderMobileList() {
  const titleEl = document.getElementById('mobileCalTitle');
  const daysEl  = document.getElementById('mobileDays');
  if (!titleEl || !daysEl) return;

  const title = new Date(viewYear, viewMonth, 1)
    .toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  titleEl.textContent = title;

  const today = toDateStr(new Date());
  const lastDay = new Date(viewYear, viewMonth + 1, 0).getDate();
  const typeColors = { sport:'#38a169', diner:'#e07b39', sortie:'#9b59d0', rdv:'#3182ce', bricolage:'#c05621', jardin:'#276749', entretien:'#2b6cb0', admin:'#6b46c1', autre:'#718096' };

  let html = '';
  for (let day = 1; day <= lastDay; day++) {
    const d  = new Date(viewYear, viewMonth, day);
    const ds = toDateStr(d);
    const evts = eventsForDay(ds);
    const multiEvts = getMultiDayEvents(ds).filter(e => e.date !== ds); // bandeaux (pas le jour de départ qui est déjà dans evts)
    const allEvts = [...evts, ...multiEvts];
    if (!allEvts.length) continue; // ne montrer que les jours avec events

    const isToday = ds === today;
    const dayNames = ['Dim','Lun','Mar','Mer','Jeu','Ven','Sam'];
    const dayName = dayNames[d.getDay()];

    html += `<div class="mobile-day-group">
      <div class="mobile-day-header${isToday?' today':''}" onclick="openAdd('${ds}')">
        <div class="mobile-day-num">${day}</div>
        <div>
          <div class="mobile-day-name">${dayName}</div>
          <div style="font-size:0.7rem;color:#a0aec0;">${allEvts.length} événement${allEvts.length>1?'s':''}</div>
        </div>
      </div>`;

    allEvts.forEach(e => {
      const type = getEventType(e);
      const color = typeColors[type] || '#718096';
      const who = (e.author||'').split(',').map(n=>n.trim()).filter(Boolean);
      const firstWho = who[0];
      const personS = getPersonStyle(e.author);
      const timeStr = e.time ? `${e.time}${e.timeEnd?' → '+e.timeEnd:''}` : '';
      const openId = e._originalId || e.id;
      const recurIcon = e._originalId ? ' 🔁' : '';
      const emoji = TYPE_EMOJI[type] || '📌';

      const mobileBg   = personS.bg;
      const mobileText = personS.text;
      const whoLabel = who.join(', ');
      html += `<div class="mobile-event-row" onclick="openEdit('${openId}')" style="background:${mobileBg};border-left:4px solid ${color};">
        <div class="mobile-event-info">
          <div class="mobile-event-title" style="color:${mobileText};">${emoji} ${e.title||e.label||''}${recurIcon}</div>
          ${timeStr ? `<div class="mobile-event-meta" style="color:${mobileText};opacity:0.75;">🕐 ${timeStr}</div>` : ''}
          ${e.lieu ? `<div class="mobile-event-meta" style="color:${mobileText};opacity:0.75;">📍 ${e.lieu}</div>` : ''}
        </div>
        ${whoLabel ? `<span class="mobile-event-who" style="background:rgba(0,0,0,0.12);color:${mobileText};font-weight:700;">${whoLabel}</span>` : ''}
      </div>`;
    });

    html += `</div>`;
  }

  if (!html) {
    html = `<div style="text-align:center;padding:40px;color:#a0aec0;font-size:0.9rem;">Aucun événement ce mois</div>`;
  }

  daysEl.innerHTML = html;
}

// ── Semaine courante ──────────────────────────────────
function renderWeekStrip() {
  const strip = document.getElementById('weekStrip');
  const today = new Date();
  today.setHours(0,0,0,0);
  const dow = today.getDay(); // 0=dim
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1));

  const dayNames = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const ds = toDateStr(d);
    const evts = eventsForDay(ds);
    const isToday = ds === toDateStr(today);
    const cls = isToday ? 'week-day today' : evts.length ? 'week-day has-event' : 'week-day';
    let evHtml = evts.slice(0, 3).map(e => {
      const typeColors = { sport:'#38a169', diner:'#e07b39', sortie:'#9b59d0', rdv:'#3182ce', bricolage:'#c05621', jardin:'#276749', entretien:'#2b6cb0', admin:'#6b46c1', autre:'#718096' };
      const typeColor = typeColors[getEventType(e)] || '#718096';
      const personS  = getPersonStyle(e.author);
      const chipBg   = personS.bg;
      const chipText = personS.text;
      const openId = e._originalId || e.id;
      const recurIcon = e._originalId ? ' 🔁' : '';
      return `<div class="week-event-chip" style="background:${chipBg};color:${chipText};border-left:3px solid ${typeColor};" onclick="openEdit('${openId}')" title="${e.title||e.label||''}">${eventLabel(e)}${recurIcon}</div>`;
    }).join('');
    if (evts.length > 3) evHtml += `<div class="more-badge">+${evts.length-3}</div>`;
    html += `<div class="${cls}">
      <div class="week-day-name">${dayNames[i]}</div>
      <div class="week-day-num">${d.getDate()}</div>
      ${evHtml}
    </div>`;
  }
  strip.innerHTML = html;
}

// ── Calendrier mensuel ────────────────────────────────
function renderCalendar() {
  const title = new Date(viewYear, viewMonth, 1)
    .toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
  document.getElementById('calTitle').textContent = title;

  const today = toDateStr(new Date());
  const firstDay = new Date(viewYear, viewMonth, 1);
  const lastDay  = new Date(viewYear, viewMonth + 1, 0);

  // Jour de début (lundi = 0)
  let startDow = firstDay.getDay() - 1;
  if (startDow < 0) startDow = 6;

  const grid = document.getElementById('calGrid');
  const days = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
  let html = days.map(d => `<div class="cal-header-cell">${d}</div>`).join('');

  // Cases vides avant le 1er
  for (let i = 0; i < startDow; i++) {
    const d = new Date(firstDay);
    d.setDate(d.getDate() - (startDow - i));
    const ds = toDateStr(d);
    const evts = eventsForDay(ds);
    html += buildCell(d, ds, true, ds === today, evts);
  }

  // Jours du mois
  for (let day = 1; day <= lastDay.getDate(); day++) {
    const d = new Date(viewYear, viewMonth, day);
    const ds = toDateStr(d);
    const evts = eventsForDay(ds);
    html += buildCell(d, ds, false, ds === today, evts);
  }

  // Compléter la dernière semaine
  const total = startDow + lastDay.getDate();
  const remain = (7 - (total % 7)) % 7;
  for (let i = 1; i <= remain; i++) {
    const d = new Date(lastDay);
    d.setDate(lastDay.getDate() + i);
    const ds = toDateStr(d);
    const evts = eventsForDay(ds);
    html += buildCell(d, ds, true, ds === today, evts);
  }

  grid.innerHTML = html;
}

function buildCell(d, ds, otherMonth, isToday, evts) {
  let cls = 'cal-cell';
  if (otherMonth) cls += ' other-month';
  if (isToday) cls += ' today';
  const multiEvts = getMultiDayEvents(ds);
  if (evts.length || multiEvts.length) cls += ' has-event';

  const bannerHtml = buildMultiDayBanners(ds);

  let evHtml = evts.slice(0, 3).map(e => {
    const typeColors = { sport:'#38a169', diner:'#e07b39', sortie:'#9b59d0', rdv:'#3182ce', bricolage:'#c05621', jardin:'#276749', entretien:'#2b6cb0', admin:'#6b46c1', autre:'#718096' };
    const typeColor = typeColors[getEventType(e)] || '#718096';
    const personS  = getPersonStyle(e.author);
    const pillBg   = personS.bg;
    const pillText = personS.text;
    const who = (e.author || '').split(',').map(n => n.trim()).filter(Boolean).join(', ');
    const openId = e._originalId || e.id;
    const recurIcon = e._originalId ? ' 🔁' : '';
    return `<div class="event-pill" style="display:flex;justify-content:space-between;gap:6px;background:${pillBg};color:${pillText};border-left:3px solid ${typeColor};" onclick="event.stopPropagation();openEdit('${openId}')">
      <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${eventLabel(e)}${recurIcon}</span>
      ${who ? `<span style="flex-shrink:0;opacity:0.8;font-weight:600;">${who}</span>` : ''}
    </div>`;
  }).join('');
  if (evts.length > 3) evHtml += `<div class="more-badge">+${evts.length-3} autres</div>`;

  return `<div class="${cls}" onclick="if(event.target.closest('.event-pill,.more-badge'))return;openAdd('${ds}')">
    <div class="day-num">${d.getDate()}</div>
    ${bannerHtml}
    ${evHtml}
  </div>`;
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function changeMonth(delta) {
  viewMonth += delta;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
  renderCalendar();
}

function goToday() {
  const now = new Date();
  viewYear  = now.getFullYear();
  viewMonth = now.getMonth();
  renderCalendar();
}

// ═══════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════
function buildAssignChecks(selected) {
  const wrap = document.getElementById('assignChecks');
  wrap.innerHTML = '';
  MEMBERS.forEach(name => {
    const lbl = document.createElement('label');
    const cb  = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = name;
    cb.checked = selected.includes(name);
    cb.style.cursor = 'pointer';
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(' ' + name));
    // Couleur badge
    const c = PERSON_COLORS[name];
    if (c) lbl.style.cssText = `display:flex;align-items:center;gap:4px;cursor:pointer;font-size:0.88rem;padding:4px 8px;border-radius:6px;background:${c.bg};color:${c.text};border:1px solid ${c.border};`;
    wrap.appendChild(lbl);
  });
}

function updateRecurrenceUI() {
  const val = document.getElementById('evRecurrence').value;
  const perso = document.getElementById('recurrencePersoBox');
  const endBox = document.getElementById('recurrenceEndBox');
  perso.style.display  = val === 'perso' ? 'block' : 'none';
  endBox.style.display = val ? 'block' : 'none';
}

function openAdd(dateStr) {
  editId = null;
  document.getElementById('modalTitle').textContent = '➕ Nouvel événement';
  document.getElementById('evTitle').value = '';
  document.getElementById('evDate').value    = dateStr || toDateStr(new Date());
  document.getElementById('evDateFin').value = '';
  document.getElementById('evType').value  = 'sport';
  document.getElementById('evRecurrence').value = '';
  document.getElementById('evRecurrenceN').value = '3';
  document.getElementById('evRecurrenceFin').value = '';
  updateRecurrenceUI();
  buildTimePickers();
  setTimePicker('evTimeH','evTimeM','');
  setTimePicker('evTimeEndH','evTimeEndM','');
  document.getElementById('evNotes').value = '';
  document.getElementById('evLieu').value = '';
  document.getElementById('btnDelete').style.display = 'none';
  buildAssignChecks(currentUser ? [currentUser] : []);
  document.getElementById('modalOverlay').style.display = 'flex';
  setTimeout(() => document.getElementById('evTitle').focus(), 100);
}

function openEdit(id) {
  const evts = getEvents();
  const e = evts[id];
  if (!e) return;

  editId = id;
  document.getElementById('modalTitle').textContent = '✏️ Modifier l\'événement';
  document.getElementById('evTitle').value = e.title || e.label || '';
  document.getElementById('evDate').value    = e.date    || '';
  document.getElementById('evDateFin').value = e.dateFin || '';
  document.getElementById('evType').value  = getEventType(e);
  document.getElementById('evRecurrence').value = e.recurrence || '';
  document.getElementById('evRecurrenceN').value = e.recurrenceN || '3';
  document.getElementById('evRecurrenceFin').value = e.recurrenceFin || '';
  updateRecurrenceUI();
  buildTimePickers();
  setTimePicker('evTimeH','evTimeM', e.time    || '');
  setTimePicker('evTimeEndH','evTimeEndM', e.timeEnd || '');
  document.getElementById('evNotes').value = e.notes || '';
  document.getElementById('evLieu').value = e.lieu || '';
  document.getElementById('btnDelete').style.display = 'inline-block';

  const assigned = (e.author || '').split(',').map(n => n.trim()).filter(Boolean);
  buildAssignChecks(assigned);
  document.getElementById('modalOverlay').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
  editId = null;
}

// Fermer si clic sur le fond
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

async function saveEvent() {
  const title   = document.getElementById('evTitle').value.trim();
  const date    = document.getElementById('evDate').value;
  const dateFin = document.getElementById('evDateFin').value;
  const time    = getTimePicker('evTimeH','evTimeM');
  const timeEnd = getTimePicker('evTimeEndH','evTimeEndM');
  const type       = document.getElementById('evType').value;
  const recurrence    = document.getElementById('evRecurrence').value;
  const recurrenceN   = parseInt(document.getElementById('evRecurrenceN').value) || 3;
  const recurrenceFin = document.getElementById('evRecurrenceFin').value;
  const notes  = document.getElementById('evNotes').value.trim();
  const lieu   = document.getElementById('evLieu').value.trim();
  const author = [...document.querySelectorAll('#assignChecks input[type=checkbox]:checked')]
                   .map(cb => cb.value).join(', ');

  if (!title || !date) { showToast('⚠️ Titre et date obligatoires'); return; }

  if (editId) {
    // Mise à jour — si c'est un event du planning, adapter les champs
    const existing = window._tasks[editId];
    const isFromPlanning = existing && existing.cat !== 'agenda';
    const updateData = isFromPlanning
      ? { title, date, dateFin, time, timeEnd, notes, lieu, author, recurrence, recurrenceN, recurrenceFin, cat: type === 'rdv' ? 'rdv' : existing.cat }
      : { title, date, dateFin, time, timeEnd, type: type, evType: type, notes, lieu, author, recurrence, recurrenceN, recurrenceFin };
    if (window.fbUpdate) await window.fbUpdate(editId, updateData);
    showToast('✅ Événement mis à jour');
  } else {
    // Nouvel event : stocké avec cat='agenda' pour le distinguer des tâches planning
    const newEvent = {
      title, date, dateFin, time, timeEnd,
      cat: 'agenda',
      type: type,
      evType: type,
      notes, lieu, author, recurrence, recurrenceN, recurrenceFin,
      status: 'rdv',          // Pour qu'il apparaisse aussi dans le planning maison
      prio: 'moyenne',
      createdAt: new Date().toISOString(),
    };
    if (window.fbAdd) await window.fbAdd(newEvent);
    showToast('✅ Événement ajouté');
  }
  closeModal();
}

async function deleteEvent() {
  if (!editId) return;
  if (!confirm('Supprimer cet événement ?')) return;
  if (window.fbDelete) await window.fbDelete(editId);
  showToast('🗑 Supprimé');
  closeModal();
}

// TOAST

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// ── Premier rendu (avant Firebase) ────────────────────
renderAll();

// ═══════════════════════════════════════════════════════
// BANNIÈRE RAPPELS DU JOUR
// ═══════════════════════════════════════════════════════
function showRappelBanner() {
  const pad = n => String(n).padStart(2,'0');
  const fmt = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const now = new Date();
  const todayStr    = fmt(now);
  const tomorrowStr = fmt(new Date(now.getFullYear(), now.getMonth(), now.getDate()+1));

  const evtsToday    = eventsForDay(todayStr);
  const evtsTomorrow = eventsForDay(tomorrowStr);
  if (!evtsToday.length && !evtsTomorrow.length) return;

  const TYPE_EMOJI_LOCAL = { sport:'🏃', diner:'🍽️', sortie:'🎉', rdv:'📅', bricolage:'🔨', jardin:'🌿', entretien:'🔧', admin:'📋', autre:'📌' };
  const fmt2 = (label, evts) => evts.map(e => {
    const em = TYPE_EMOJI_LOCAL[getEventType(e)] || '📌';
    const h  = e.time ? ` ${e.time}` : '';
    const who = e.author ? ` (${e.author.split(',')[0].trim()})` : '';
    return `<span class="rappel-item">${em}${h} ${e.title||e.label||''}${who}</span>`;
  }).join('');

  let html = '';
  if (evtsToday.length)    html += `📅 <strong>Aujourd'hui :</strong> ${fmt2('Aujourd\'hui', evtsToday)} `;
  if (evtsTomorrow.length) html += `📅 <strong>Demain :</strong> ${fmt2('Demain', evtsTomorrow)}`;

  const banner = document.getElementById('rappelBanner');
  document.getElementById('rappelContent').innerHTML = html;
  banner.style.display = 'block';
}

// ═══════════════════════════════════════════════════════
// SÉLECTEURS HEURE / MINUTE (paliers 5 min)
// ═══════════════════════════════════════════════════════
function buildTimePickers() {
  // Heures 00→23
  let hOpts = '<option value="">hh</option>';
  for (let h = 0; h < 24; h++) hOpts += `<option value="${String(h).padStart(2,'0')}">${String(h).padStart(2,'0')}</option>`;
  // Minutes 00,05,10…55
  let mOpts = '<option value="">mm</option>';
  for (let m = 0; m < 60; m += 5) mOpts += `<option value="${String(m).padStart(2,'0')}">${String(m).padStart(2,'0')}</option>`;
  ['evTimeH','evTimeEndH'].forEach(id => document.getElementById(id).innerHTML = hOpts);
  ['evTimeM','evTimeEndM'].forEach(id => document.getElementById(id).innerHTML = mOpts);
}

function setTimePicker(hId, mId, val) {
  // val = "HH:MM" ou ""
  const parts = (val || '').split(':');
  document.getElementById(hId).value = parts[0] || '';
  document.getElementById(mId).value = parts[1] ? parts[1].slice(0,2) : '';
}

function getTimePicker(hId, mId) {
  const h = document.getElementById(hId).value;
  const m = document.getElementById(mId).value;
  return h && m ? `${h}:${m}` : '';
}

function clearTime(hId, mId) {
  document.getElementById(hId).value = '';
  document.getElementById(mId).value = '';
}

// ═══════════════════════════════════════════════════════
// SUGGESTIONS TITRE (agenda)
// ═══════════════════════════════════════════════════════
const EV_SUGGESTIONS = {
  '🏃 Sport': [
    'Ping-pong', 'Tennis de table', 'Match de foot', 'Vélo', 'Course à pied',
    'Natation', 'Randonnée', 'Badminton', 'Tennis', 'Salle de sport',
    'Yoga', 'Ski', 'Escalade', 'Pétanque', 'Golf',
  ],
  '🍽️ Dîner / Invitation': [
    'Dîner chez des amis', 'Invitation à dîner', 'Repas en famille',
    'Barbecue', 'Apéro', 'Anniversaire', 'Pot de départ', 'Soirée raclette',
    'Brunch', 'Repas de Noël', 'Repas de Pâques', 'Crêpes',
  ],
  '🎉 Sortie': [
    'Cinéma', 'Théâtre', 'Concert', 'Musée', 'Parc d\'attractions',
    'Zoo', 'Bowling', 'Karting', 'Escape game', 'Marché', 'Exposition',
    'Fête foraine', 'Balade en forêt', 'Pique-nique', 'Plage',
  ],
  '📅 Rendez-vous': [
    'Médecin', 'Dentiste', 'Kiné', 'Vétérinaire', 'Coiffeur',
    'Réunion parents-profs', 'Contrôle technique', 'Banque', 'Notaire',
    'Opticien', 'Pharmacie', 'Démarche administrative',
  ],
  '📌 Autre': [
    'Courses', 'Bricolage', 'Jardinage', 'Ménage', 'Livraison',
    'Visite', 'Vacances', 'Week-end', 'Travail', 'Formation',
  ],
};

let _evSuggFocus = -1;
let _evAllSuggOpen = false;

function getEvSuggItems() {
  const arr = [];
  Object.entries(EV_SUGGESTIONS).forEach(([cat, items]) => {
    items.forEach(label => arr.push({ cat, label }));
  });
  return arr;
}

function filterEvSugg(q) {
  _evAllSuggOpen = false;
  const box = document.getElementById('evSuggBox');
  if (!q) { hideEvSugg(); return; }
  const matches = getEvSuggItems().filter(s => s.label.toLowerCase().includes(q.toLowerCase())).slice(0, 10);
  if (!matches.length) { hideEvSugg(); return; }
  box.innerHTML = matches.map((s, i) =>
    `<div class="ev-sugg-item" data-i="${i}" data-label="${s.label}"
      style="padding:8px 14px;cursor:pointer;font-size:0.87rem;border-bottom:1px solid #f0f0f0;"
      onmousedown="pickEvSugg(this)"
      onmouseover="this.style.background='#f0f4ff'"
      onmouseout="this.style.background=''">${s.label}</div>`
  ).join('');
  box.style.display = 'block';
  _evSuggFocus = -1;
}

function toggleAllEvSugg() {
  const box = document.getElementById('evSuggBox');
  if (_evAllSuggOpen) { hideEvSugg(); return; }
  _evAllSuggOpen = true;
  let html = `<div style="padding:8px 14px;font-size:0.75rem;font-weight:700;color:#718096;background:#f7fafc;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;">Toutes les suggestions <span onmousedown="hideEvSugg()" style="cursor:pointer;font-size:1rem;color:#a0aec0;">✕</span></div>`;
  Object.entries(EV_SUGGESTIONS).forEach(([cat, items]) => {
    html += `<div style="padding:5px 14px;font-size:0.72rem;font-weight:700;color:#805ad5;background:#faf5ff;border-bottom:1px solid #e9d8fd;text-transform:uppercase;letter-spacing:.5px;">${cat}</div>`;
    items.forEach(label => {
      html += `<div class="ev-sugg-item" data-label="${label}"
        style="padding:7px 14px;cursor:pointer;font-size:0.87rem;border-bottom:1px solid #f0f0f0;"
        onmousedown="pickEvSugg(this)"
        onmouseover="this.style.background='#f0f4ff'"
        onmouseout="this.style.background=''">${label}</div>`;
    });
  });
  box.innerHTML = html;
  box.style.display = 'block';
}

function pickEvSugg(el) {
  document.getElementById('evTitle').value = el.dataset.label;
  // Auto-sélectionner le type correspondant
  const cat = el.closest ? el.closest('[data-cat]') : null;
  // Mapper catégorie → type select
  const catToType = {
    '🏃 Sport': 'sport',
    '🍽️ Dîner / Invitation': 'diner',
    '🎉 Sortie': 'sortie',
    '📅 Rendez-vous': 'rdv',
    '📌 Autre': 'autre',
  };
  // Trouver la catégorie de ce label
  for (const [c, items] of Object.entries(EV_SUGGESTIONS)) {
    if (items.includes(el.dataset.label)) {
      document.getElementById('evType').value = catToType[c] || 'autre';
      break;
    }
  }
  hideEvSugg();
}

function hideEvSugg() {
  document.getElementById('evSuggBox').style.display = 'none';
  _evSuggFocus = -1;
  _evAllSuggOpen = false;
}

function evSuggKey(e) {
  const box = document.getElementById('evSuggBox');
  const items = box.querySelectorAll('.ev-sugg-item');
  if (!items.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _evSuggFocus = Math.min(_evSuggFocus + 1, items.length - 1);
    items.forEach((el, i) => el.style.background = i === _evSuggFocus ? '#f0f4ff' : '');
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    _evSuggFocus = Math.max(_evSuggFocus - 1, 0);
    items.forEach((el, i) => el.style.background = i === _evSuggFocus ? '#f0f4ff' : '');
  } else if (e.key === 'Enter' && _evSuggFocus >= 0) {
    e.preventDefault();
    pickEvSugg(items[_evSuggFocus]);
  } else if (e.key === 'Escape') {
    hideEvSugg();
  }
}

// ── Clavier ───────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowLeft')  { changeMonth(-1); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'ArrowRight') { changeMonth(1); }
});
