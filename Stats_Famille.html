<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stats Famille – Charge familiale</title>
<style>
  :root {
    --machin-bg:#bee3f8; --machin-text:#1a365d; --machin-border:#90cdf4; --machin-dark:#3182ce;
    --bidule-bg:#fc8181; --bidule-text:#742a2a; --bidule-border:#e53e3e; --bidule-dark:#c53030;
    --bibi-bg:#c6f6d5;   --bibi-text:#1a4731;   --bibi-border:#68d391;   --bibi-dark:#276749;
    --bg:#f0f4f8; --card:#ffffff; --txt:#2d3748; --txt2:#718096;
    --hdr: linear-gradient(135deg,#667eea 0%,#764ba2 100%);
    --radius:14px;
  }
  body.dark {
    --bg:#1a202c; --card:#2d3748; --txt:#e2e8f0; --txt2:#a0aec0;
    --machin-bg:#2b6cb0; --machin-text:#bee3f8;
    --bidule-bg:#9b2c2c; --bidule-text:#fed7d7;
    --bibi-bg:#276749;   --bibi-text:#c6f6d5;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; transition:background .3s,color .3s; }

  header { background:var(--hdr); color:white; padding:14px 18px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; position:sticky; top:0; z-index:200; box-shadow:0 2px 8px rgba(0,0,0,.2); }
  header h1 { font-size:1.1rem; font-weight:800; }
  .header-right { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .nav-link { padding:6px 12px; border-radius:20px; border:2px solid rgba(255,255,255,.5); background:rgba(255,255,255,.15); color:white; font-size:.8rem; font-weight:600; text-decoration:none; white-space:nowrap; transition:background .15s; }
  .nav-link:hover { background:rgba(255,255,255,.28); }
  .nav-link.active { background:rgba(255,255,255,.35); border-color:white; }
  .btn-hdr { padding:6px 12px; border-radius:20px; border:2px solid rgba(255,255,255,.5); background:rgba(255,255,255,.15); color:white; font-size:.85rem; cursor:pointer; transition:background .15s; }
  .btn-hdr:hover { background:rgba(255,255,255,.28); }

  .container { max-width:960px; margin:0 auto; padding:16px; }

  /* Sélecteur de période */
  .period-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:18px; }
  .period-btn { padding:6px 16px; border-radius:20px; border:1.5px solid #cbd5e0; background:var(--card); color:var(--txt); cursor:pointer; font-size:.85rem; font-weight:600; transition:all .2s; }
  .period-btn.active { background:var(--hdr); color:white; border-color:transparent; }
  .period-label { font-size:.85rem; color:var(--txt2); font-weight:600; margin-left:4px; }

  /* Cartes résumé par personne */
  .person-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:22px; }
  .person-card { background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.07); border-top:4px solid var(--border-color); }
  .person-card.machin { --border-color:var(--machin-dark); }
  .person-card.bidule { --border-color:var(--bidule-dark); }
  .person-card.bibi   { --border-color:var(--bibi-dark); }
  .pc-name { font-size:1rem; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .pc-badge { display:inline-block; padding:3px 12px; border-radius:20px; font-size:.78rem; font-weight:700; }
  .pc-badge.machin { background:var(--machin-bg); color:var(--machin-text); }
  .pc-badge.bidule { background:var(--bidule-bg); color:var(--bidule-text); }
  .pc-badge.bibi   { background:var(--bibi-bg);   color:var(--bibi-text); }
  .pc-stat { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid rgba(0,0,0,.06); font-size:.85rem; }
  .pc-stat:last-child { border-bottom:none; }
  .pc-stat .num { font-size:1.3rem; font-weight:900; color:var(--border-color); }
  .pc-stat .lbl { color:var(--txt2); }
  .load-bar-wrap { margin-top:10px; }
  .load-bar-bg { height:8px; border-radius:4px; background:rgba(0,0,0,.1); overflow:hidden; }
  .load-bar-fill { height:100%; border-radius:4px; transition:width .6s ease; }
  .load-bar-fill.machin { background:var(--machin-dark); }
  .load-bar-fill.bidule { background:var(--bidule-dark); }
  .load-bar-fill.bibi   { background:var(--bibi-dark); }
  .load-pct { font-size:.72rem; color:var(--txt2); text-align:right; margin-top:3px; }

  /* Section graphique barres */
  .section-title { font-size:.9rem; font-weight:800; color:var(--txt2); text-transform:uppercase; letter-spacing:.06em; margin-bottom:10px; }
  .chart-card { background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:0 2px 8px rgba(0,0,0,.07); margin-bottom:18px; }
  .bar-chart { display:flex; flex-direction:column; gap:10px; }
  .bar-row { display:flex; align-items:center; gap:10px; }
  .bar-label { width:120px; font-size:.82rem; color:var(--txt); text-align:right; flex-shrink:0; }
  .bar-wrap { flex:1; display:flex; gap:4px; align-items:center; }
  .bar { height:22px; border-radius:4px; min-width:2px; transition:width .6s ease; display:flex; align-items:center; padding:0 6px; font-size:.72rem; font-weight:700; color:white; overflow:hidden; white-space:nowrap; }
  .bar-val { font-size:.8rem; color:var(--txt2); font-weight:700; flex-shrink:0; }

  /* Tableau catégories */
  .cat-table { width:100%; border-collapse:collapse; font-size:.85rem; }
  .cat-table th { text-align:left; padding:8px 10px; color:var(--txt2); font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; border-bottom:2px solid rgba(0,0,0,.08); }
  .cat-table td { padding:8px 10px; border-bottom:1px solid rgba(0,0,0,.05); }
  .cat-table tr:last-child td { border-bottom:none; }
  .mini-dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; }

  /* Pied de page */
  .footer-note { text-align:center; font-size:.75rem; color:var(--txt2); margin-top:24px; padding-bottom:24px; }

  /* Spinner chargement */
  .loading { text-align:center; padding:40px; color:var(--txt2); font-size:1.1rem; }
</style>
</head>
<body>

<header>
  <h1>📊 Stats Famille</h1>
  <div class="header-right">
    <a class="nav-link" href="Planning_Maison_Partage.html">🏠 Planning</a>
    <a class="nav-link" href="Agenda_Familial.html">📅 Agenda</a>
    <a class="nav-link" href="Courses_Maison.html">🛒 Courses</a>
    <a class="nav-link active" href="Stats_Famille.html">📊 Stats</a>
    <a class="nav-link" href="Notifications_Config.html">🔔 Notifs</a>
    <span id="sfUserBadge" onclick="switchProfile()" title="Changer de profil" class="nav-link" style="cursor:pointer;">👤 ?</span>
    <button class="btn-hdr" onclick="toggleDark()" id="darkBtn">🌙</button>
  </div>
</header>

<div class="container">
  <div id="appContent">
    <div class="loading">⏳ Connexion à Firebase…</div>
  </div>
</div>

<div class="footer-note">Stats basées sur toutes les tâches et événements enregistrés · Mise à jour en temps réel</div>

<!-- ═══════════════════════════════════════════════════════
     FIREBASE (module ESM)
═══════════════════════════════════════════════════════ -->
<script type="module">
import { initializeApp }       from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

const firebaseConfig = {
  apiKey:            "AIzaSyB2YnkiivjhxOmmAfS9JtvRRWwB3dsF86U",
  authDomain:        "planning-maison-7eace.firebaseapp.com",
  databaseURL:       "https://planning-maison-7eace-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:         "planning-maison-7eace",
  storageBucket:     "planning-maison-7eace.firebasestorage.app",
  messagingSenderId: "365827317336",
  appId:             "1:365827317336:web:27412c4c05d67a7a81342d"
};

const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

// Écoute temps réel des tâches planning
onValue(ref(db, 'planning/tasks'), snap => {
  const tasks = snap.val() || {};
  window._sfTasks = Object.values(tasks);
  renderStats();
});

// Les events Agenda sont stockés dans planning/tasks avec cat:'agenda'
// Le listener planning/tasks ci-dessus les inclut déjà — pas de nœud séparé agenda/events
window._sfEvents = [];
</script>

<!-- ═══════════════════════════════════════════════════════
     AUTH + PROFILE (même logique que les autres pages)
═══════════════════════════════════════════════════════ -->
<script>
// ── Auth ──
const AUTH_KEY = 'maison_auth';
const AUTH_PWD = 'Maison05';
if (localStorage.getItem(AUTH_KEY) !== AUTH_PWD) {
  const pwd = prompt('Mot de passe Maison :');
  if (pwd !== AUTH_PWD) { document.body.innerHTML='<div style="text-align:center;padding:60px;font-size:1.1rem;color:#c53030;">❌ Accès refusé</div>'; throw new Error('auth'); }
  localStorage.setItem(AUTH_KEY, AUTH_PWD);
}

// ── Profil ──
const MEMBERS_LIST = ['Machin','Bidule','Bibi'];
let currentUser = null;

function loadProfile() {
  try { const p = JSON.parse(localStorage.getItem('pmUser')||'null'); if (p && p.name) { currentUser = p.name; updateBadge(); } }
  catch(e) {}
}
function updateBadge() {
  const b = document.getElementById('sfUserBadge');
  if (!b) return;
  if (currentUser) { const c = {Machin:'#bee3f8',Bidule:'#fc8181',Bibi:'#c6f6d5'}[currentUser]||'rgba(255,255,255,.2)'; b.textContent = '👤 '+currentUser; b.style.background = c; b.style.color = currentUser==='Bidule'?'#742a2a':'#1a365d'; }
  else { b.textContent='👤 ?'; b.style.background='rgba(255,255,255,.15)'; b.style.color='white'; }
}
function checkOrSetupPin(name, onSuccess) {
  const key = 'pmPin_'+name;
  const stored = localStorage.getItem(key);
  if (stored) {
    const entered = prompt('PIN pour '+name+' :');
    if (!entered) return;
    if (entered === stored) { onSuccess(); }
    else { alert('PIN incorrect'); }
  } else {
    const pin = prompt('Créer un PIN (4 chiffres) pour '+name+' :');
    if (!pin || !/^\d{4}$/.test(pin)) { alert('PIN invalide (4 chiffres requis)'); return; }
    const confirm2 = prompt('Confirmez le PIN :');
    if (pin !== confirm2) { alert('PINs différents'); return; }
    localStorage.setItem(key, pin);
    onSuccess();
  }
}
function switchProfile() {
  const choice = prompt('Choisissez :\n1 = Machin\n2 = Bidule\n3 = Bibi\n0 = Déconnexion');
  if (choice === null) return;
  if (choice === '0') { currentUser = null; localStorage.removeItem('pmUser'); updateBadge(); return; }
  const map = {'1':'Machin','2':'Bidule','3':'Bibi'};
  const name = map[choice] || MEMBERS_LIST.find(m => m.toLowerCase() === choice.toLowerCase());
  if (!name) { alert('Choix invalide'); return; }
  checkOrSetupPin(name, () => {
    currentUser = name;
    localStorage.setItem('pmUser', JSON.stringify({name}));
    updateBadge();
  });
}
loadProfile();

// ── Dark mode ──
function toggleDark() {
  document.body.classList.toggle('dark');
  localStorage.setItem('darkMode', document.body.classList.contains('dark') ? '1' : '0');
  document.getElementById('darkBtn').textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
}
if (localStorage.getItem('darkMode') === '1') { document.body.classList.add('dark'); document.getElementById('darkBtn').textContent = '☀️'; }

// ─────────────────────────────────────────────────────
// PÉRIODE DE FILTRAGE
// ─────────────────────────────────────────────────────
let sfPeriod = '30'; // '7', '30', '90', '365', 'all'

function setPeriod(p) {
  sfPeriod = p;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.toggle('active', b.dataset.p === p));
  renderStats();
}

// ─────────────────────────────────────────────────────
// CALCUL DES STATS
// ─────────────────────────────────────────────────────
const PERSON_CFG = {
  Machin: { cls:'machin', bg:'#bee3f8', text:'#1a365d', dark:'#3182ce' },
  Bidule: { cls:'bidule', bg:'#fc8181', text:'#742a2a', dark:'#c53030' },
  Bibi:   { cls:'bibi',   bg:'#c6f6d5', text:'#1a4731', dark:'#276749' }
};

const CAT_LABEL = {
  bricolage:'🔨 Bricolage', jardin:'🌿 Jardin', entretien:'🔧 Entretien',
  admin:'📋 Admin', rdv:'📅 Rendez-vous', sport:'⚽ Sport',
  diner:'🍽️ Dîner', sortie:'🎭 Sortie', deplacement:'✈️ Déplacement pro',
  agenda:'📅 Agenda', autre:'🗂 Autre'
};

window._sfTasks  = window._sfTasks  || [];
window._sfEvents = window._sfEvents || [];

function getItemDate(item) {
  return item.date || item.createdAt_date || null;
}
function getItemAuthors(item) {
  if (!item.author) return [];
  if (Array.isArray(item.author)) return item.author;
  return item.author.split('+').map(s => s.trim()).filter(Boolean);
}

function computeStats() {
  const cutoff = sfPeriod === 'all' ? null : (() => {
    const d = new Date(); d.setDate(d.getDate() - parseInt(sfPeriod)); return d.toISOString().slice(0,10);
  })();

  // Fusionner tâches planning + events agenda
  const all = [
    ...(window._sfTasks  || []),
    ...(window._sfEvents || []).map(e => ({...e, _src:'agenda'}))
  ];

  const filtered = all.filter(item => {
    if (!cutoff) return true;
    const d = getItemDate(item);
    return !d || d >= cutoff;
  });

  // Stats par personne
  const perPerson = {};
  MEMBERS_LIST.forEach(m => perPerson[m] = { total:0, todo:0, inprog:0, done:0, cats:{} });

  filtered.forEach(item => {
    const authors = getItemAuthors(item);
    authors.forEach(author => {
      const p = perPerson[author];
      if (!p) return;
      p.total++;
      if (item.status === 'done') p.done++;
      else if (item.status === 'inprog' || item.status === 'progress') p.inprog++;
      else p.todo++;
      const cat = item.cat || 'autre';
      p.cats[cat] = (p.cats[cat] || 0) + 1;
    });
  });

  // Stats par catégorie (qui fait quoi)
  const catMap = {};
  filtered.forEach(item => {
    const cat = item.cat || 'autre';
    if (!catMap[cat]) catMap[cat] = { total:0, byPerson:{} };
    catMap[cat].total++;
    getItemAuthors(item).forEach(a => {
      catMap[cat].byPerson[a] = (catMap[cat].byPerson[a] || 0) + 1;
    });
  });

  // Évolution mensuelle (6 derniers mois)
  const monthMap = {};
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    monthMap[key] = { Machin:0, Bidule:0, Bibi:0 };
  }
  all.forEach(item => {
    const d = getItemDate(item);
    if (!d) return;
    const key = d.slice(0,7);
    if (!monthMap[key]) return;
    getItemAuthors(item).forEach(a => {
      if (monthMap[key][a] !== undefined) monthMap[key][a]++;
    });
  });

  const totalAll = Object.values(perPerson).reduce((s, p) => s + p.total, 0);

  return { perPerson, catMap, monthMap, totalAll, filtered: filtered.length };
}

// ─────────────────────────────────────────────────────
// RENDU
// ─────────────────────────────────────────────────────
function renderStats() {
  const { perPerson, catMap, monthMap, totalAll, filtered } = computeStats();

  const periodLabels = { '7':'7 derniers jours', '30':'30 derniers jours', '90':'3 derniers mois', '365':'12 derniers mois', 'all':'Toute la période' };

  const maxPersonTotal = Math.max(...MEMBERS_LIST.map(m => perPerson[m].total), 1);

  // ── Cartes par personne ──
  const personCardsHtml = MEMBERS_LIST.map(name => {
    const p = perPerson[name];
    const cfg = PERSON_CFG[name];
    const pct = totalAll > 0 ? Math.round(p.total / totalAll * 100) : 0;
    return `<div class="person-card ${cfg.cls}">
      <div class="pc-name"><span class="pc-badge ${cfg.cls}">${name}</span></div>
      <div class="pc-stat"><span class="lbl">📋 Total</span><span class="num">${p.total}</span></div>
      <div class="pc-stat"><span class="lbl">🕐 À faire</span><span class="num" style="color:#c05621;">${p.todo}</span></div>
      <div class="pc-stat"><span class="lbl">⚙️ En cours</span><span class="num" style="color:#2b6cb0;">${p.inprog}</span></div>
      <div class="pc-stat"><span class="lbl">✅ Terminé</span><span class="num" style="color:${cfg.dark};">${p.done}</span></div>
      <div class="load-bar-wrap">
        <div class="load-bar-bg"><div class="load-bar-fill ${cfg.cls}" style="width:${pct}%"></div></div>
        <div class="load-pct">${pct}% de la charge totale</div>
      </div>
    </div>`;
  }).join('');

  // ── Graphique barres évolution mensuelle ──
  const months = Object.keys(monthMap);
  const maxMonth = Math.max(...months.flatMap(k => MEMBERS_LIST.map(m => monthMap[k][m])), 1);
  const monthBarHtml = months.map(key => {
    const label = new Date(key+'-01').toLocaleDateString('fr-FR',{month:'short',year:'2-digit'});
    const bars = MEMBERS_LIST.map(name => {
      const v = monthMap[key][name] || 0;
      const w = Math.round(v / maxMonth * 100);
      const cfg = PERSON_CFG[name];
      return `<div class="bar" style="width:${w}%;background:${cfg.dark};" title="${name}: ${v}">${v > 0 ? v : ''}</div>`;
    }).join('');
    return `<div class="bar-row">
      <div class="bar-label">${label}</div>
      <div class="bar-wrap">${bars}</div>
    </div>`;
  }).join('');

  const legendHtml = MEMBERS_LIST.map(name => {
    const cfg = PERSON_CFG[name];
    return `<span style="font-size:.78rem;"><span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${cfg.dark};margin-right:4px;"></span>${name}</span>`;
  }).join('<span style="margin:0 8px;color:var(--txt2);">|</span>');

  // ── Tableau catégories ──
  const catRows = Object.entries(catMap)
    .sort((a,b) => b[1].total - a[1].total)
    .map(([cat, data]) => {
      const mini = MEMBERS_LIST.map(name => {
        const v = data.byPerson[name] || 0;
        const cfg = PERSON_CFG[name];
        return v > 0 ? `<span style="display:inline-flex;align-items:center;gap:3px;margin-right:8px;font-size:.78rem;background:${cfg.bg};color:${cfg.text};border-radius:10px;padding:2px 8px;font-weight:700;">${name.charAt(0)} ${v}</span>` : '';
      }).join('');
      return `<tr>
        <td style="font-weight:600;">${CAT_LABEL[cat] || cat}</td>
        <td style="text-align:center;font-weight:800;color:var(--txt);">${data.total}</td>
        <td>${mini}</td>
      </tr>`;
    }).join('');

  // ── Assemblage ──
  document.getElementById('appContent').innerHTML = `
    <!-- Sélecteur période -->
    <div class="period-bar">
      <span class="period-label">Période :</span>
      ${['7','30','90','365','all'].map(p =>
        `<button class="period-btn${sfPeriod===p?' active':''}" data-p="${p}" onclick="setPeriod('${p}')">${{7:'7j',30:'30j',90:'3 mois',365:'12 mois',all:'Tout'}[p]}</button>`
      ).join('')}
      <span style="margin-left:auto;font-size:.78rem;color:var(--txt2);">${filtered} événements · ${periodLabels[sfPeriod]||''}</span>
    </div>

    <!-- Cartes personnes -->
    <div class="section-title">👤 Charge par personne</div>
    <div class="person-grid">${personCardsHtml}</div>

    <!-- Évolution mensuelle -->
    <div class="chart-card">
      <div class="section-title" style="margin-bottom:4px;">📈 Évolution mensuelle (6 mois)</div>
      <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;">${legendHtml}</div>
      <div class="bar-chart">${monthBarHtml || '<div style="color:var(--txt2);font-size:.85rem;">Pas encore de données</div>'}</div>
    </div>

    <!-- Tableau catégories -->
    <div class="chart-card">
      <div class="section-title" style="margin-bottom:12px;">🗂 Répartition par catégorie</div>
      ${catRows ? `<table class="cat-table">
        <thead><tr><th>Catégorie</th><th style="text-align:center;">Total</th><th>Détail</th></tr></thead>
        <tbody>${catRows}</tbody>
      </table>` : '<div style="color:var(--txt2);font-size:.85rem;">Pas encore de données</div>'}
    </div>
  `;
}

// Rendu initial (avant que Firebase réponde)
renderStats();
</script>

<!-- PWA (même manifeste que les autres pages) -->
